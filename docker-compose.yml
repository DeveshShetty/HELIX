# One-command startup:  docker compose up --build
x-service-env: &service-env
  RABBIT_HOST: rabbitmq
  RABBIT_EXCHANGE: support.events
  # retry limits (common/retry.py, common/messaging.py, common/db.py); override for demos
  MAX_DELIVERY_ATTEMPTS: ${MAX_DELIVERY_ATTEMPTS:-5}        # consumer: then dead-letter
  OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-10}           # outbox relay: then park the event
  ESCALATION_MAX_ATTEMPTS: ${ESCALATION_MAX_ATTEMPTS:-10}   # chat escalation worker: then alert
  # ONE daily AI budget shared by chat, knowledge and summariser (common/budget.py)
  AI_BUDGET_DB: /budget/ai_budget.db
  DAILY_COST_CEILING_USD: ${DAILY_COST_CEILING_USD:-0.50}
  DAILY_TOKEN_CEILING: ${DAILY_TOKEN_CEILING:-200000}

x-depends-rabbit: &depends-rabbit
  rabbitmq:
    condition: service_healthy

# restart policy + resource limits for every container (sized from `docker stats`: the
# Python services idle at ~40-47 MiB, RabbitMQ ~150 MiB, Grafana ~120 MiB)
x-app: &app
  restart: unless-stopped
  mem_limit: 256m
  cpus: 0.5

services:
  rabbitmq:
    restart: unless-stopped
    mem_limit: 1g        # 512m was too small: RabbitMQ hit 505/512 MiB on restart and took 107 s to start
    cpus: 2.0
    image: rabbitmq:4-management
    hostname: rabbitmq   # stable node name so the data volume survives restarts
    ports: ["5672:5672", "15672:15672"]   # UI: http://localhost:15672 (guest/guest)
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 180s   # first boot on a small laptop takes 1-3 min; failures here don't count

  chat:
    <<: *app
    build: { context: ., dockerfile: services/chat/Dockerfile }
    environment:
      <<: *service-env
      DB_PATH: /data/chat.db
      KNOWLEDGE_URL: http://knowledge:8004
      TICKETS_URL: http://tickets:8002
      # thresholds keyed by INDEX VERSION (exact match wins) or embedding model (fallback);
      # 0.40 is from eval/results/threshold_curve.csv on index hash-v1-20261117T190438.
      # THRESHOLD_STRICT=1: an index version not listed here always escalates.
      CONFIDENCE_THRESHOLDS: ${CONFIDENCE_THRESHOLDS:-{"hash-v1-20261117T190438":0.40,"hash-v1":0.40}}
      THRESHOLD_STRICT: ${THRESHOLD_STRICT:-0}
      MAX_PROMPT_TOKENS: ${MAX_PROMPT_TOKENS:-1500}
      # KB call deadline per attempt / for all attempts. 2 s suits hash-v1; a nomic-embed-text
      # query takes 2.5-3.6 s on a laptop CPU, so the v2 index needs a longer deadline (E17).
      KB_TIMEOUT: ${KB_TIMEOUT:-2.0}
      KB_BUDGET: ${KB_BUDGET:-3.0}
      LLM_MODE: ${LLM_MODE:-simulated}          # simulated | ollama
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    extra_hosts: ["host.docker.internal:host-gateway"]   # reach Ollama on the host
    volumes: [chat_data:/data, ai_budget:/budget]
    ports: ["8001:8001"]           # chat UI: http://localhost:8001
    depends_on: *depends-rabbit

  tickets:
    <<: *app
    build: { context: ., dockerfile: services/tickets/Dockerfile }
    environment:
      <<: *service-env
      DB_PATH: /data/tickets.db
    volumes: [tickets_data:/data]
    ports: ["8002:8002"]
    depends_on: *depends-rabbit

  oncall:
    <<: *app
    build: { context: ., dockerfile: services/oncall/Dockerfile }
    environment:
      <<: *service-env
      DB_PATH: /data/oncall.db
      TICKETS_URL: http://tickets:8002
      CHAT_URL: http://chat:8001                        # conversations live in the Chat service
      SUMMARISER_URL: http://summariser:8005            # drafts awaiting approval
      ACK_TIMEOUT_SECONDS: ${ACK_TIMEOUT_SECONDS:-30}   # unacked page -> next level after this
    volumes: [oncall_data:/data]
    ports: ["8003:8003"]           # on-call console: http://localhost:8003
    depends_on: *depends-rabbit

  knowledge:
    <<: *app
    build: { context: ., dockerfile: services/knowledge/Dockerfile }
    environment:
      <<: *service-env
      DB_PATH: /data/knowledge.db
      OLLAMA_URL: http://host.docker.internal:11434      # nomic-embed-text for the v2 index
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [knowledge_data:/data, ai_budget:/budget]
    ports: ["8004:8004"]
    depends_on: *depends-rabbit

  summariser:
    <<: *app
    build: { context: ., dockerfile: services/summariser/Dockerfile }
    environment:
      <<: *service-env
      DB_PATH: /data/summariser.db
      TICKETS_URL: http://tickets:8002
      LLM_MODE: ${LLM_MODE:-simulated}          # ollama => LLM drafts (grounding-checked)
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [summariser_data:/data, ai_budget:/budget]
    ports: ["8005:8005"]
    depends_on: *depends-rabbit

  prometheus:
    <<: *app
    image: prom/prometheus:v3.1.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports: ["9090:9090"]

  grafana:
    <<: *app
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/platform.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  rabbitmq_data:
  chat_data:
  tickets_data:
  oncall_data:
  knowledge_data:
  summariser_data:
  ai_budget:          # shared daily AI spend ledger (common/budget.py)
