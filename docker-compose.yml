# One-command startup:  docker compose up --build
x-service-env: &service-env
  RABBIT_HOST: rabbitmq
  RABBIT_EXCHANGE: support.events

x-depends-rabbit: &depends-rabbit
  rabbitmq:
    condition: service_healthy

services:
  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq   # stable node name so the data volume survives restarts
    ports: ["5672:5672", "15672:15672"]   # UI: http://localhost:15672 (guest/guest)
    volumes: [rabbitmq_data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  chat:
    build: { context: ., dockerfile: services/chat/Dockerfile }
    environment:
      <<: *service-env
      DB_PATH: /data/chat.db
      KNOWLEDGE_URL: http://knowledge:8004
      TICKETS_URL: http://tickets:8002
      # one threshold PER EMBEDDING MODEL; a model missing here => always escalate
      # provisional: from eval/results/threshold_curve.csv on the 50-question set (hash-v1)
      CONFIDENCE_THRESHOLDS: ${CONFIDENCE_THRESHOLDS:-{"hash-v1":0.40}}
      DAILY_COST_CEILING_USD: ${DAILY_COST_CEILING_USD:-0.50}
      MAX_PROMPT_TOKENS: ${MAX_PROMPT_TOKENS:-1500}
      LLM_MODE: ${LLM_MODE:-simulated}          # simulated | ollama
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    extra_hosts: ["host.docker.internal:host-gateway"]   # reach Ollama on the host
    volumes: [chat_data:/data]
    ports: ["8001:8001"]           # chat UI: http://localhost:8001
    depends_on: *depends-rabbit

  tickets:
    build: { context: ., dockerfile: services/tickets/Dockerfile }
    environment:
      <<: *service-env
      DB_PATH: /data/tickets.db
    volumes: [tickets_data:/data]
    ports: ["8002:8002"]
    depends_on: *depends-rabbit

  oncall:
    build: { context: ., dockerfile: services/oncall/Dockerfile }
    environment:
      <<: *service-env
      DB_PATH: /data/oncall.db
      TICKETS_URL: http://tickets:8002
      CHAT_URL: http://chat:8001                        # conversations live in the Chat service
      SUMMARISER_URL: http://summariser:8005            # drafts awaiting approval
      ACK_TIMEOUT_SECONDS: ${ACK_TIMEOUT_SECONDS:-30}   # unacked page -> next level after this
    volumes: [oncall_data:/data]
    ports: ["8003:8003"]           # on-call console: http://localhost:8003
    depends_on: *depends-rabbit

  knowledge:
    build: { context: ., dockerfile: services/knowledge/Dockerfile }
    environment:
      <<: *service-env
      DB_PATH: /data/knowledge.db
    volumes: [knowledge_data:/data]
    ports: ["8004:8004"]
    depends_on: *depends-rabbit

  summariser:
    build: { context: ., dockerfile: services/summariser/Dockerfile }
    environment:
      <<: *service-env
      DB_PATH: /data/summariser.db
      TICKETS_URL: http://tickets:8002
      LLM_MODE: ${LLM_MODE:-simulated}          # ollama => LLM drafts (grounding-checked)
      OLLAMA_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:1b}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [summariser_data:/data]
    ports: ["8005:8005"]
    depends_on: *depends-rabbit

  prometheus:
    image: prom/prometheus:v3.1.0
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/platform.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  rabbitmq_data:
  chat_data:
  tickets_data:
  oncall_data:
  knowledge_data:
  summariser_data:
