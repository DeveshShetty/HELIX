<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helix Cloud On-Call Console</title>
<script>/* apply the saved theme (or the OS setting) before the page paints */(function(){var t=localStorage.getItem("helix-theme");if(!t)t=matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light";document.documentElement.dataset.theme=t;})();</script>
<style>

  /* Helix theme: light by default; dark via [data-theme=dark] (set from the toggle or the OS). */
  :root {
    --bg: #f3f5f4; --panel: #ffffff; --sunken: #f7f9f8; --ink: #17201f; --muted: #5d6b69; --line: #dbe2e0;
    --accent: #0f7c74; --on-accent: #ffffff; --accent-soft: #e4f2f0; --accent-line: #b9dcd8; --focus: #0f7c74;
    --ok: #1f7a4d; --ok-bg: #e3f3ea; --warn: #9a5b00; --warn-bg: #fbf0dc; --bad: #b42318; --bad-bg: #fde8e7;
    --deg: #6941c6; --deg-bg: #efe9fb; --agent-bg: #fdf5e6; --agent-line: #eed8ac;
    --rb: var(--accent); --faq: var(--ok); --inc: var(--warn); --learned: var(--deg);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0e1514; --panel: #172220; --sunken: #121b1a; --ink: #e4ecea; --muted: #93a5a2; --line: #2b3b39;
    --accent: #3cc0b2; --on-accent: #06201d; --accent-soft: #16322f; --accent-line: #24504b; --focus: #3cc0b2;
    --ok: #5cc98f; --ok-bg: #15301f; --warn: #e8ad57; --warn-bg: #33270f; --bad: #f08a7f; --bad-bg: #3a1a17;
    --deg: #b9a3f0; --deg-bg: #2a2140; --agent-bg: #2a2314; --agent-line: #4d3f1f;
    color-scheme: dark;
  }
  body { transition: background-color .2s, color .2s; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  h1 .mark { width: 22px; height: 22px; color: var(--accent); flex: none; }
  h1.brand { display: flex; align-items: center; gap: 8px; }
  .theme { font: inherit; font-size: 15px; line-height: 1; width: 34px; height: 30px; border-radius: 8px; cursor: pointer;
           border: 1px solid var(--line); background: var(--panel); color: var(--ink); flex: none; }
  .theme:hover { border-color: var(--accent); color: var(--accent); }
  input, select, textarea { color: var(--ink); background-color: var(--panel); }
  ::placeholder { color: var(--muted); opacity: 1; }
  @media (prefers-reduced-motion: reduce) { *, body { transition: none !important; animation: none !important; } }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 20px;
           display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .who { margin-left: auto; display: flex; align-items: center; gap: 8px; color: var(--muted); }
  select, input, textarea { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); color: var(--ink); }
  main { max-width: 1040px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 13px; }
  .chain { display: flex; gap: 6px; align-items: center; }
  .chain b { color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-weight: 600; }
  .warn-note { color: var(--warn); background: var(--warn-bg); padding: 6px 10px; border-radius: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  #list { display: flex; flex-direction: column; gap: 10px; }
  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .tid { font-weight: 700; }
  .title { flex: 1; min-width: 200px; }
  .status { font-size: 11px; font-weight: 700; letter-spacing: .04em; border-radius: 6px; padding: 2px 8px; }
  .s-OPEN { color: var(--bad); background: var(--bad-bg); }
  .s-ACKED { color: var(--warn); background: var(--warn-bg); }
  .s-RESOLVED { color: var(--ok); background: var(--ok-bg); }
  .pages { margin-top: 8px; font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  .pages .live { color: var(--ink); font-weight: 600; }
  .pages .late { color: var(--bad); }
  /* the page waiting for an ack, with a countdown that shrinks to the escalation */
  .paging { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--ink); font-weight: 600; }
  .countdown { flex: 1; min-width: 140px; max-width: 280px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .countdown i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width 2s linear; }
  .paging.late .countdown i { background: var(--bad); }
  .paging.late .left { color: var(--bad); }
  .left { font-weight: 400; font-size: 12px; color: var(--muted); }
  /* status tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tab { font: inherit; font-weight: 600; font-size: 13px; padding: 8px 12px; border: 0; border-bottom: 2px solid transparent;
         border-radius: 0; background: none; color: var(--muted); cursor: pointer; margin-bottom: -1px; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
  .tab .n { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 999px; font-size: 11px;
            background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
  .tab[aria-selected="true"] .n { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
  @media (max-width: 600px) { main { padding: 12px; } header { padding: 10px 12px; } }
  .actions { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-start; }
  button { font: inherit; font-weight: 600; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button:disabled { opacity: .5; cursor: default; }
  form.resolve { display: none; flex-direction: column; gap: 6px; width: 100%; margin-top: 6px; }
  form.resolve.open { display: flex; }
  form.resolve textarea { min-height: 70px; }
  .hint { font-size: 12px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .livetag { font-size: 11px; font-weight: 700; letter-spacing: .04em; border-radius: 6px; padding: 2px 8px;
             color: var(--on-accent); background: var(--bad); animation: pulse 1.6s infinite; }
  .livetag.on { background: var(--ok); animation: none; }
  @keyframes pulse { 50% { opacity: .55; } }
  .chatpanel { margin-top: 10px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .chatlog { max-height: 300px; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; background: var(--sunken); }
  .line { font-size: 13px; white-space: pre-wrap; }
  .line .r { font-weight: 700; margin-right: 6px; }
  .r-user { color: var(--accent); } .r-bot { color: var(--muted); } .r-agent { color: var(--warn); } .r-system { color: var(--muted); font-style: italic; }
  .why { display: block; font-size: 11px; color: var(--bad); margin-left: 2px; }
  .chatin { display: flex; gap: 8px; padding: 8px; border-top: 1px solid var(--line); background: var(--panel); flex-wrap: wrap; }
  .chatin input { flex: 1; min-width: 200px; }
  .summaries { border-color: var(--accent-line); background: var(--accent-soft); }
  .sumhead { font-weight: 700; font-size: 15px; }
  .sumitem { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .sumitem .top { font-size: 12px; color: var(--muted); }
  .sumitem textarea.article { min-height: 170px; font-family: inherit; }
  .checks { display: flex; flex-wrap: wrap; gap: 6px; }
  .chk { font-size: 12px; border-radius: 6px; padding: 2px 8px; }
  .chk.ok { color: var(--ok); background: var(--ok-bg); }
  .chk.bad { color: var(--bad); background: var(--bad-bg); }
  .altdraft { font-size: 13px; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: 8px;
              padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; white-space: pre-wrap; }
  .altdraft b { color: var(--ink); font-weight: 600; }
  .altdraft button { align-self: flex-start; margin-top: 4px; font-size: 12px; padding: 4px 10px; }
  .err { color: var(--bad); font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1 class="brand"><svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 2c0 7 10 7 10 10s-10 3-10 10"/><path d="M17 2c0 7-10 7-10 10s10 3 10 10"/><path d="M9.5 6.5h5M9.5 17.5h5" stroke-width="1.6"/></svg>Helix Cloud On-Call <span>incident console</span></h1>
  <div class="who">Responding as
    <select id="me"></select>
  </div>
  <button class="theme" id="themeBtn" type="button" aria-label="Switch to dark mode">&#9790;</button>
</header>
<main>
  <div class="bar" id="bar"></div>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Filter incidents"></nav>
  <div id="list"><div class="empty">Loading…</div></div>
</main>

<script>
const list = document.getElementById('list');
const bar = document.getElementById('bar');
const me = document.getElementById('me');
const openForms = new Set();   // keep resolve forms open across refreshes
const drafts = {};             // and keep what was typed into them
const chats = {};              // ticket_id -> { cid, messages, lastSeq, status } for open conversation panels

// ---------------------------------------------------------------- conversation panel
const ROLE = { user: 'Customer', bot: 'Helix bot', agent: 'Agent', system: 'System' };

function renderLine(m) {
  const line = el('div', 'line');
  line.append(el('span', 'r r-' + m.role, m.role === 'agent' ? m.author : ROLE[m.role]), document.createTextNode(m.text));
  if (m.role === 'bot' && m.decision === 'escalate') {
    const why = m.confidence !== null && m.confidence !== undefined
      ? `got stuck: ${m.reason.replaceAll('_', ' ')} (confidence ${m.confidence.toFixed(2)} < threshold ${m.threshold})`
      : `got stuck: ${m.reason.replaceAll('_', ' ')}`;
    line.append(el('span', 'why', why));
  }
  return line;
}

async function loadChat(tid) {
  const c = chats[tid];
  try {
    const r = await fetch(`/tickets/${tid}/conversation?after=${c.lastSeq}`);
    if (!r.ok) { c.error = r.status === 404 ? 'No chat conversation for this ticket.' : 'Chat service unreachable.'; return; }
    const d = await r.json();
    c.error = null; c.cid = d.conversation_id; c.status = d.status; c.agent = d.agent_id;
    const log = document.getElementById('log-' + tid);
    for (const m of d.messages) {
      c.messages.push(m); c.lastSeq = Math.max(c.lastSeq, m.seq);
      if (log) { log.append(renderLine(m)); log.scrollTop = log.scrollHeight; }
    }
  } catch { c.error = 'Chat service unreachable.'; }
}

function chatPanel(t) {
  const c = chats[t.ticket_id];
  const panel = el('div', 'chatpanel');
  const log = el('div', 'chatlog'); log.id = 'log-' + t.ticket_id;
  if (c.error) log.append(el('div', 'line r-system', c.error));
  c.messages.forEach(m => log.append(renderLine(m)));
  panel.append(log);
  if (c.cid && c.status !== 'CLOSED') {
    const row = el('form', 'chatin');
    const box = el('input'); box.placeholder = 'Message the customer…';
    const send = el('button', 'primary', 'Send'); send.type = 'submit';
    const end = el('button', null, 'End chat & draft summary'); end.type = 'button';
    row.onsubmit = async (e) => {
      e.preventDefault();
      const text = box.value.trim(); if (!text) return;
      box.value = '';
      await post(`/conversations/${c.cid}/messages`, { responder_id: me.value, text });
      await loadChat(t.ticket_id);
    };
    end.onclick = async () => {
      end.disabled = true; end.textContent = 'Ending chat…';
      try {
        await post(`/conversations/${c.cid}/close`, { responder_id: me.value });
        await loadChat(t.ticket_id);
      } finally { refresh(true); }
    };
    row.append(box, send, end);
    panel.append(row);
  } else if (c.status === 'CLOSED') {
    panel.append(el('div', 'line r-system', ' Chat ended. The Summariser is drafting a summary: it will appear under "Summaries to approve" at the top.'));
  }
  setTimeout(() => { log.scrollTop = log.scrollHeight; }, 0);
  return panel;
}

setInterval(() => { for (const tid of Object.keys(chats)) loadChat(tid); }, 1500);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail || ('HTTP ' + r.status));
  return data;
}

function ago(sec) {
  sec = Math.round(sec);
  return sec < 60 ? sec + 's' : Math.floor(sec / 60) + 'm ' + (sec % 60) + 's';
}

function renderTicket(t, now) {
  const card = el('div', 'card');
  const top = el('div', 'top');
  top.append(el('span', 'tid', t.ticket_id), el('span', 'status s-' + t.status, t.status),
             el('span', 'title', t.title || ''));
  if (t.revision) top.append(el('span', 'hint', 'rev ' + t.revision));
  if (t.live_chat) {
    top.append(el('span', 'livetag' + (t.live_chat.status === 'LIVE' ? ' on' : ''),
      t.live_chat.status === 'LIVE' ? 'LIVE CHAT · ' + t.live_chat.agent_id : 'CUSTOMER WAITING IN CHAT'));
  }
  card.append(top);

  const pages = el('div', 'pages');
  const live = (t.pages || []).find(p => p.status === 'PENDING');
  const history = (t.pages || []).slice().reverse();          // oldest first
  if (live) {
    const left = Math.max(0, live.deadline - now);
    const row = el('div', 'paging' + (left < 10 ? ' late' : ''));
    const bar = el('span', 'countdown'); const fill = el('i');
    fill.style.width = Math.min(100, (left / ackTimeout) * 100) + '%';
    bar.append(fill);
    bar.setAttribute('role', 'progressbar');
    bar.setAttribute('aria-label', 'Time until this page escalates');
    bar.setAttribute('aria-valuemin', '0'); bar.setAttribute('aria-valuemax', String(ackTimeout));
    bar.setAttribute('aria-valuenow', String(Math.round(left)));
    row.append(el('span', null, `Paging ${live.responder_id} (level ${live.level})`), bar,
               el('span', 'left', left > 0 ? `escalates in ${ago(left)}` : 'escalating now'));
    pages.append(row);
  }
  if (history.length) {
    // "alice → bob → carol ×3": consecutive pages to the same person are counted, not repeated
    const runs = [];
    for (const p of history) {
      const lastRun = runs[runs.length - 1];
      if (lastRun && lastRun.who === p.responder_id) lastRun.n++;
      else runs.push({ who: p.responder_id, n: 1 });
    }
    const acked = history.find(p => p.status === 'ACKED');
    const trail = runs.map(r => r.n > 1 ? `${r.who} ×${r.n}` : r.who).join(' → ');
    pages.append(el('div', null, `Escalation so far: ${trail}` + (acked ? ` (acked by ${acked.responder_id})` : '')));
  }
  if (t.status === 'RESOLVED' && t.resolution) pages.append(el('div', null, 'Resolution: ' + t.resolution));
  if (pages.childNodes.length) card.append(pages);

  const actions = el('div', 'actions');
  const err = el('div', 'err');
  const run = async (fn) => { err.textContent = ''; try { await fn(); refresh(); } catch (e) { err.textContent = e.message; } };

  if (live) {
    const b = el('button', 'primary', `Ack page (${live.responder_id})`);
    b.onclick = () => run(() => post(`/pages/${live.page_id}/ack`, { responder_id: me.value }));
    actions.append(b);
  }
  const convBtn = el('button', null, chats[t.ticket_id] ? 'Hide conversation' : (t.live_chat ? 'Join live chat' : 'Open conversation'));
  convBtn.onclick = async () => {
    if (chats[t.ticket_id]) { delete chats[t.ticket_id]; refresh(true); return; }
    chats[t.ticket_id] = { cid: null, messages: [], lastSeq: 0, status: null, error: null };
    await loadChat(t.ticket_id);
    refresh(true);
  };
  actions.append(convBtn);
  if (t.status !== 'RESOLVED') {
    const b = el('button', null, 'Resolve…');
    const form = el('form', 'resolve' + (openForms.has(t.ticket_id) ? ' open' : ''));
    const summary = el('input'); summary.placeholder = 'Problem summary (written by you, e.g. "Exporting invoices to CSV")';
    const resolution = el('textarea'); resolution.placeholder = 'Resolution: the fix, in steps a customer can follow';
    const d = drafts[t.ticket_id] || {};
    summary.value = d.summary || ''; resolution.value = d.resolution || '';
    const kbRow = el('label', 'hint');
    const kb = el('input'); kb.type = 'checkbox'; kb.checked = d.kb !== false;
    kbRow.append(kb, ' Reusable answer: add to the knowledge base so the assistant can answer this next time ' +
                     '(untick for one-off issues, e.g. a single late order)');
    const submit = el('button', 'primary');
    const label = () => { submit.textContent = kb.checked ? 'Resolve and add to knowledge base' : 'Resolve (not added to knowledge base)'; };
    label();
    const save = () => { drafts[t.ticket_id] = { ...drafts[t.ticket_id], summary: summary.value, resolution: resolution.value, kb: kb.checked }; };
    summary.oninput = resolution.oninput = save;
    kb.onchange = () => { save(); label(); };
    const hint = el('div', 'hint', d.note
      ? `Pre-filled from the chat (${d.note}). It is built from the conversation: check and edit it before resolving. Personal details are removed automatically, but read it anyway.`
      : 'Only your summary and resolution are added to the knowledge base, never the customer’s original message.');
    submit.type = 'submit';
    form.append(summary, resolution, hint, kbRow, submit);
    form.onsubmit = (e) => { e.preventDefault(); run(async () => {
      await post(`/incidents/${t.ticket_id}/resolve`, { responder_id: me.value, summary: summary.value,
                 resolution: resolution.value, add_to_knowledge_base: kb.checked });
      openForms.delete(t.ticket_id); delete drafts[t.ticket_id];
    }); };
    b.onclick = () => { openForms.has(t.ticket_id) ? openForms.delete(t.ticket_id) : openForms.add(t.ticket_id); form.classList.toggle('open'); };
    actions.append(b, form);
  } else {
    const b = el('button', null, 'Reopen (resolution was wrong)');
    b.onclick = () => run(() => post(`/incidents/${t.ticket_id}/reopen`, { responder_id: me.value, reason: 'resolution did not work' }));
    actions.append(b);
  }
  if (chats[t.ticket_id]) card.append(chatPanel(t));
  card.append(actions, err);
  return card;
}

// ---------------------------------------------------------------- summaries to approve
const sumEdits = {};   // draft_id -> { summary, resolution, kb } typed by the reviewer

function renderSummaries(list) {
  const box = el('div', 'card summaries');
  box.append(el('div', 'sumhead', `Summaries to approve (${list.length})`),
             el('div', 'hint', 'Drafted automatically by the Summariser from finished live chats. Check them, edit if needed, then approve to resolve the ticket.'));
  for (const s of list) {
    const e = sumEdits[s.draft_id] || (sumEdits[s.draft_id] = { summary: s.problem, resolution: s.fix, kb: true });
    const item = el('div', 'sumitem');
    item.append(el('div', 'top', `${s.draft_id} · ${s.ticket_id || 'no ticket'} · chat with ${s.agent_id || '?'} · drafted by ${s.method}`));
    const checks = el('div', 'checks');
    for (const c of s.checks) checks.append(el('span', 'chk ' + (c.ok ? 'ok' : 'bad'), (c.ok ? '✔ ' : '✖ ') + c.check.replace('_', ' ') + ': ' + c.detail));
    const summary = el('input'); summary.value = e.summary; summary.placeholder = 'Article title (generic, e.g. "Location and file upload not working in the iOS app")';
    const resolution = el('textarea'); resolution.className = 'article'; resolution.value = e.resolution; resolution.placeholder = 'Symptoms: ...\n\nCause: ...\n\nSteps:\n1. ...';
    const fromLabel = el('div', 'hint', s.method.startsWith('rule-based') || s.method.startsWith('extractive')
      ? 'Below: an article built by rules from the chat (generic title, the agent’s advice as steps). Check the wording.'
      : 'Below: the AI’s article; its steps were checked against what the agent said.');
    let alt = null;
    if (s.llm_draft) {
      alt = el('div', 'altdraft');
      alt.append(el('b', null, `What the AI wrote (not used: ${s.llm_draft.why})`));
      if (s.llm_draft.problem) alt.append(el('div', null, 'PROBLEM: ' + s.llm_draft.problem));
      alt.append(el('div', null, (s.llm_draft.problem ? 'FIX: ' : '') + s.llm_draft.fix));
      if (s.llm_draft.problem) {
        const use = el('button', null, 'Use the AI’s version instead');
        use.onclick = () => { summary.value = s.llm_draft.problem; resolution.value = s.llm_draft.fix;
                              Object.assign(e, { summary: summary.value, resolution: resolution.value }); };
        alt.append(use);
      }
    }
    const kbRow = el('label', 'hint');
    const kb = el('input'); kb.type = 'checkbox'; kb.checked = e.kb;
    kbRow.append(kb, ' Reusable answer: add to the knowledge base (untick for one-off issues)');
    summary.oninput = resolution.oninput = kb.onchange = () => { Object.assign(e, { summary: summary.value, resolution: resolution.value, kb: kb.checked }); };
    const err = el('div', 'err');
    const approve = el('button', 'primary', '✔ Approve & resolve');
    const reject = el('button', null, '✖ Reject');
    approve.onclick = async () => {
      err.textContent = '';
      try { await post(`/summaries/${s.draft_id}/approve`, { responder_id: me.value, summary: summary.value, resolution: resolution.value, add_to_knowledge_base: kb.checked });
            delete sumEdits[s.draft_id]; refresh(true); }
      catch (x) { err.textContent = x.message; }
    };
    reject.onclick = async () => {
      try { await post(`/summaries/${s.draft_id}/reject`, { responder_id: me.value, reason: 'rejected in console' });
            delete sumEdits[s.draft_id]; refresh(true); }
      catch (x) { err.textContent = x.message; }
    };
    const btns = el('div', 'actions'); btns.append(approve, reject);
    item.append(checks);
    if (alt) item.append(alt);
    item.append(fromLabel, summary, resolution, kbRow, btns, err);
    box.append(item);
  }
  return box;
}

// ---------------------------------------------------------------- status tabs
let ackTimeout = 30;
const TABS = {
  open:     { label: 'Needs action', match: t => t.status === 'OPEN',     empty: 'Nothing needs action right now.' },
  acked:    { label: 'In progress',  match: t => t.status === 'ACKED',    empty: 'No incidents in progress.' },
  resolved: { label: 'Resolved',     match: t => t.status === 'RESOLVED', empty: 'No resolved incidents yet.' },
  all:      { label: 'All',          match: () => true,                   empty: 'No incidents yet.' },
};
let tab = localStorage.getItem('helix-console-tab') || 'open';
if (!TABS[tab]) tab = 'open';

function rank(t) {
  if (t.live_chat && t.live_chat.status === 'WAITING_AGENT') return 0;
  if (t.live_chat) return 1;
  if ((t.pages || []).some(p => p.status === 'PENDING')) return 2;
  return 3;
}

function renderTabs(tickets) {
  const nav = document.getElementById('tabs');
  nav.replaceChildren();
  for (const [key, def] of Object.entries(TABS)) {
    const b = el('button', 'tab', def.label);
    b.type = 'button';
    b.setAttribute('role', 'tab');
    b.setAttribute('aria-selected', String(key === tab));
    b.append(el('span', 'n', String(tickets.filter(def.match).length)));
    b.onclick = () => { tab = key; localStorage.setItem('helix-console-tab', key); refresh(true); };
    nav.append(b);
  }
}

async function refresh(force) {
  // don't redraw while typing (open chat panels update their own message list in place)
  if (!force && document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;
  try {
    const d = await (await fetch('/console/data')).json();
    if (!me.options.length) {
      for (const n of d.roster.chain) me.append(new Option(n, n));
    }
    bar.replaceChildren();
    const chain = el('span', 'chain', 'Escalation chain (roster v' + d.roster.version + '):');
    d.roster.chain.forEach((n, i) => { chain.append(el('b', null, n)); if (i < d.roster.chain.length - 1) chain.append('→'); });
    bar.append(chain, el('span', null, `· unacked pages escalate after ${d.ack_timeout_seconds}s`));
    if (d.source !== 'live') bar.append(el('span', 'warn-note', 'Showing ' + d.source));
    list.replaceChildren();
    if (d.summaries === null) list.append(el('div', 'warn-note', 'Summariser service unreachable: summaries will appear when it is back.'));
    else if (d.summaries.length) list.append(renderSummaries(d.summaries));
    ackTimeout = d.ack_timeout_seconds || 30;
    renderTabs(d.tickets);
    const shown = d.tickets
      .filter(t => TABS[tab].match(t))
      // a customer waiting in live chat comes first, then anything being paged, then newest
      .sort((a, b) => rank(a) - rank(b));
    if (!d.tickets.length) list.append(el('div', 'empty', 'No incidents yet. When the chat assistant escalates a question, it appears here.'));
    else if (!shown.length) list.append(el('div', 'empty', TABS[tab].empty));
    for (const t of shown) list.append(renderTicket(t, d.now));
  } catch (e) {
    list.replaceChildren(el('div', 'empty', 'On-call service unreachable: ' + e.message));
  }
}

refresh();
setInterval(refresh, 2000);
</script>
<script>
(function () {
  const btn = document.getElementById('themeBtn');
  const label = () => {
    const dark = document.documentElement.dataset.theme === 'dark';
    btn.textContent = dark ? '\u2600' : '\u263E';
    btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
    btn.title = btn.getAttribute('aria-label');
  };
  btn.addEventListener('click', () => {
    const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    localStorage.setItem('helix-theme', next);
    label();
  });
  label();
})();
</script>
